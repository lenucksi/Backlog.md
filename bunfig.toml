[install]
# MUST use hoisted — isolated (.bun/ flat structure) breaks CJS packages
# that expect nested node_modules, e.g. neo-neo-bblessed, graceful-fs, etc.
linker = "hoisted"

[test]
# NOTE: timeout must be set via --timeout CLI flag in package.json.
# bunfig [test].timeout is silently ignored in Bun 1.3.x.
# Reduce memory usage during test runs to prevent WSL2 crashes
smol = true

# Reduce concurrency to help with Windows file system contention
# Note: This is a future-proofing setting as Bun may add concurrency controls

# Exclude stale worktrees from test runs
pathIgnorePatterns = ["worktrees/*"]
