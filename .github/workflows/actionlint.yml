name: Actionlint

on:
  pull_request:
    paths:
      - '.github/workflows/*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: reviewdog/action-actionlint@a7cfc5e60a6b364e9fa5f29ac59c5cbf83b4bc32 # v1
        with:
          level: error
          fail_level: error
          filter_mode: nofilter
