name: Release multi-platform executables

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write

env:
  BUN_VERSION: 1.2.4

jobs:
  build:
    name: build-${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64-baseline
          - os: ubuntu-latest
            target: bun-linux-arm64
          - os: macos-latest
            target: bun-darwin-x64
          - os: macos-latest
            target: bun-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64-baseline
    runs-on: ${{ matrix.os }}
    env:
      BIN: backlog-bin${{ contains(matrix.target,'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ matrix.target }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-bun-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - name: Sync version to tag
        shell: bash
        run: |
          TAG="${GITHUB_REF##refs/tags/v}"
          jq ".version = \"$TAG\"" package.json > tmp.json && mv tmp.json package.json
      - name: Prime Bun cache for baseline target (Windows workaround)
        if: ${{ contains(matrix.target, 'baseline') && contains(matrix.target, 'windows') }}
        shell: bash
        run: |
          # Workaround for https://github.com/oven-sh/bun/issues/13513
          # Build a dummy project from C:\ to prime the baseline binary cache
          cd /c
          mkdir -p bun-cache-primer
          cd bun-cache-primer
          echo 'console.log("cache primer")' > index.js
          bun build --compile --target=${{ matrix.target }} ./index.js --outfile primer.exe || true
          cd $GITHUB_WORKSPACE
      - name: Compile standalone binary
        shell: bash
        run: |
          mkdir -p dist
          bun build src/cli.ts --compile --minify --target=${{ matrix.target }} --external bun --define __EMBEDDED_VERSION__="\"${GITHUB_REF##refs/tags/v}\"" --outfile=dist/${{ env.BIN }}
      - name: Make binary executable (non-Windows)
        if: ${{ !contains(matrix.target,'windows') }}
        run: chmod +x "dist/${{ env.BIN }}"
      - name: Check build output and move binary
        shell: bash
        run: |
          echo "Contents of dist/:"
          ls -la dist/
          echo "Moving dist/${{ env.BIN }} to ${{ env.BIN }}"
          mv dist/${{ env.BIN }} ${{ env.BIN }}
          echo "Final binary size:"
          ls -lh ${{ env.BIN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backlog-${{ matrix.target }}
          path: ${{ env.BIN }}

  npm-publish:
    needs: [build, verify-platform-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare npm package
        shell: bash
        run: |
          mkdir -p dist
          cp scripts/cli.cjs dist/cli.js
          cp scripts/resolveBinary.cjs dist/resolveBinary.cjs
          cp scripts/postuninstall.cjs dist/postuninstall.cjs
          chmod +x dist/cli.js
      - name: Create npm-ready package.json
        shell: bash
        run: |
          TAG="${GITHUB_REF##refs/tags/v}"
          jq 'del(.devDependencies,.scripts.prepare,.scripts.preinstall,.type) |
              .version = "'$TAG'" |
              .bin = {backlog:"cli.js"} |
              .files = ["cli.js","resolveBinary.cjs","postuninstall.cjs","package.json","README.md","LICENSE"] |
              .scripts = {"postuninstall": "node postuninstall.cjs"} |
              .repository = {"type":"git","url":"https://github.com/lenucksi/Backlog.md"} |
              .publishConfig = {"registry":"https://npm.pkg.github.com"} |
              .name = "@lenucksi/backlog.md" |
              .optionalDependencies = {
                "@lenucksi/backlog.md-linux-x64"  : "'$TAG'",
                "@lenucksi/backlog.md-linux-arm64": "'$TAG'",
                "@lenucksi/backlog.md-darwin-x64" : "'$TAG'",
                "@lenucksi/backlog.md-darwin-arm64": "'$TAG'",
                "@lenucksi/backlog.md-windows-x64": "'$TAG'"
              }' package.json > dist/package.json
          cp LICENSE README.md dist/ 2>/dev/null || true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Configure npm for GitHub Packages
        run: |
          echo "@lenucksi:registry=https://npm.pkg.github.com" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
      - name: Publish to GitHub Packages
        run: |
          cd dist
          npm publish

  publish-binaries:
    needs: build
    strategy:
      matrix:
        include:
          - target: bun-linux-x64-baseline
            package: "@lenucksi/backlog.md-linux-x64"
            os: linux
            cpu: x64
          - target: bun-linux-arm64
            package: "@lenucksi/backlog.md-linux-arm64"
            os: linux
            cpu: arm64
          - target: bun-darwin-x64
            package: "@lenucksi/backlog.md-darwin-x64"
            os: darwin
            cpu: x64
          - target: bun-darwin-arm64
            package: "@lenucksi/backlog.md-darwin-arm64"
            os: darwin
            cpu: arm64
          - target: bun-windows-x64-baseline
            package: "@lenucksi/backlog.md-windows-x64"
            os: win32
            cpu: x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backlog-${{ matrix.target }}
        timeout-minutes: 15
      - name: Prepare package
        shell: bash
        run: |
          TAG="${GITHUB_REF##refs/tags/v}"
          mkdir -p pkg
          if [[ -f backlog-bin.exe ]]; then
            mv backlog-bin.exe pkg/backlog.exe
          elif [[ -f backlog-bin ]]; then
            mv backlog-bin pkg/backlog
          else
            echo "Error: No binary found"
            ls -la
            exit 1
          fi
          cp LICENSE README.md pkg/ 2>/dev/null || true
          cat <<EOF > pkg/package.json
          {
            "name": "${{ matrix.package }}",
            "version": "${TAG}",
            "os": ["${{ matrix.os }}"],
            "cpu": ["${{ matrix.cpu }}"],
            "files": ["backlog${{ contains(matrix.target,'windows') && '.exe' || '' }}","package.json","LICENSE"],
            "publishConfig": {"registry":"https://npm.pkg.github.com"},
            "repository": {
              "type": "git",
              "url": "https://github.com/lenucksi/Backlog.md"
            }
          }
          EOF
      - name: Ensure executable permission (non-Windows)
        if: ${{ !contains(matrix.target,'windows') }}
        shell: bash
        run: |
          chmod +x pkg/backlog
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Configure npm for GitHub Packages
        run: |
          echo "@lenucksi:registry=https://npm.pkg.github.com" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
      - name: Dry run platform publish
        run: |
          cd pkg
          npm publish --dry-run
      - name: Publish platform package
        run: |
          cd pkg
          npm publish

  verify-platform-packages:
    name: verify-platform-packages-${{ matrix.os }}
    needs: publish-binaries
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Wait for platform package installability (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          set -uo pipefail
          VERSION="${GITHUB_REF##refs/tags/v}"
          MAX_ATTEMPTS=40
          SLEEP_SECONDS=15
          PACKAGE_NAME="$(node -e 'const map = { win32: "windows", darwin: "darwin", linux: "linux" }; const platform = map[process.platform]; const arch = process.arch; if (!platform || !["x64","arm64"].includes(arch)) { process.exit(1); } process.stdout.write(`@lenucksi/backlog.md-${platform}-${arch}`);')"
          BINARY_PATH="node_modules/${PACKAGE_NAME}/backlog"

          echo "Waiting for ${PACKAGE_NAME}@${VERSION} to become installable..."
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            rm -rf sanity
            mkdir sanity
            cd sanity
            npm init -y >/dev/null 2>&1
            echo "@lenucksi:registry=https://npm.pkg.github.com" > .npmrc
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

            if npm i "${PACKAGE_NAME}@${VERSION}" --prefer-online --no-audit --no-fund; then
              if [[ -f "$BINARY_PATH" ]]; then
                if "./$BINARY_PATH" -v; then
                  echo "Resolved ${PACKAGE_NAME}@${VERSION} on attempt ${attempt}/${MAX_ATTEMPTS}."
                  exit 0
                fi
              fi
            fi

            echo "Attempt ${attempt}/${MAX_ATTEMPTS} failed for ${PACKAGE_NAME}@${VERSION}."
            npm ls --depth=1 || true
            ls -la node_modules || true
            cd ..

            if [[ "$attempt" -lt "$MAX_ATTEMPTS" ]]; then
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "Timed out waiting for ${PACKAGE_NAME}@${VERSION}."
          exit 1
      - name: Wait for all platform package metadata (Linux only)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          set -uo pipefail
          VERSION="${GITHUB_REF##refs/tags/v}"
          MAX_ATTEMPTS=40
          SLEEP_SECONDS=15
          PACKAGES=(
            "@lenucksi/backlog.md-linux-x64"
            "@lenucksi/backlog.md-linux-arm64"
            "@lenucksi/backlog.md-darwin-x64"
            "@lenucksi/backlog.md-darwin-arm64"
            "@lenucksi/backlog.md-windows-x64"
          )

          for pkg in "${PACKAGES[@]}"; do
            resolved=0
            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              version="$(npm view "${pkg}@${VERSION}" --registry https://npm.pkg.github.com version 2>/dev/null || true)"
              if [[ "$version" == "$VERSION" ]]; then
                echo "Metadata visible: ${pkg}@${VERSION} (attempt ${attempt}/${MAX_ATTEMPTS})."
                resolved=1
                break
              fi

              echo "Attempt ${attempt}/${MAX_ATTEMPTS} metadata miss for ${pkg}@${VERSION}."
              if [[ "$attempt" -lt "$MAX_ATTEMPTS" ]]; then
                sleep "$SLEEP_SECONDS"
              fi
            done

            if [[ "$resolved" -ne 1 ]]; then
              echo "Timed out waiting for metadata: ${pkg}@${VERSION}."
              exit 1
            fi
          done
      - name: Wait for platform package installability (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Version = $env:GITHUB_REF_NAME.TrimStart("v")
          $MaxAttempts = 40
          $SleepSeconds = 15
          $Arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($Arch -ne "x64" -and $Arch -ne "arm64") {
            throw "Unsupported runner arch: $Arch"
          }

          $PackageName = "@lenucksi/backlog.md-windows-$Arch"
          $BinaryPath = Join-Path -Path "node_modules/$PackageName" -ChildPath "backlog.exe"

          Write-Host "Waiting for $PackageName@$Version to become installable..."
          for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
            if (Test-Path "sanity") {
              Remove-Item -Recurse -Force "sanity"
            }
            New-Item -ItemType Directory -Path "sanity" | Out-Null
            Push-Location "sanity"

            try {
              npm init -y | Out-Null
              "@lenucksi:registry=https://npm.pkg.github.com" | Out-File -FilePath ".npmrc" -Encoding ASCII
              "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" | Out-File -FilePath ".npmrc" -Encoding ASCII -Append
              npm i "$PackageName@$Version" --prefer-online --no-audit --no-fund
              if ($LASTEXITCODE -eq 0 -and (Test-Path $BinaryPath)) {
                & $BinaryPath -v
                if ($LASTEXITCODE -eq 0) {
                  Write-Host "Resolved $PackageName@$Version on attempt $attempt/$MaxAttempts."
                  exit 0
                }
              }

              Write-Host "Attempt $attempt/$MaxAttempts failed for $PackageName@$Version."
              npm ls --depth=1 | Out-Host
              if (Test-Path node_modules) {
                Get-ChildItem node_modules | Out-Host
              }
            } finally {
              Pop-Location
            }

            if ($attempt -lt $MaxAttempts) {
              Start-Sleep -Seconds $SleepSeconds
            }
          }

          throw "Timed out waiting for $PackageName@$Version."

  install-sanity:
    name: install-sanity-${{ matrix.os }}
    needs: [publish-binaries, npm-publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install and run backlog -v (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          set -uo pipefail
          VERSION="${GITHUB_REF##refs/tags/v}"
          MAX_ATTEMPTS=40
          SLEEP_SECONDS=15
          EXPECTED_PACKAGE="$(node -e 'const map = { win32: "windows", darwin: "darwin", linux: "linux" }; const platform = map[process.platform]; const arch = process.arch; if (!platform || !["x64","arm64"].includes(arch)) { process.exit(1); } process.stdout.write(`@lenucksi/backlog.md-${platform}-${arch}`);')"
          echo "Waiting for @lenucksi/backlog.md@${VERSION} install + ${EXPECTED_PACKAGE} optional dependency..."

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            rm -rf sanity
            mkdir sanity
            cd sanity
            npm init -y >/dev/null 2>&1
            echo "@lenucksi:registry=https://npm.pkg.github.com" > .npmrc
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

            if npm i "@lenucksi/backlog.md@${VERSION}" --prefer-online --no-audit --no-fund; then
              if npx backlog -v; then
                echo "Install sanity succeeded on attempt ${attempt}/${MAX_ATTEMPTS}."
                exit 0
              fi
            fi

            echo "Attempt ${attempt}/${MAX_ATTEMPTS} failed."
            echo "Expected optional package: ${EXPECTED_PACKAGE}"
            npm ls --depth=1 || true
            if [[ -d "node_modules/${EXPECTED_PACKAGE}" ]]; then
              echo "Optional package directory exists: node_modules/${EXPECTED_PACKAGE}"
            else
              echo "Optional package directory missing: node_modules/${EXPECTED_PACKAGE}"
            fi
            cd ..

            if [[ "$attempt" -lt "$MAX_ATTEMPTS" ]]; then
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "Install sanity timed out for @lenucksi/backlog.md@${VERSION}."
          exit 1
      - name: Install and run backlog -v (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Version = $env:GITHUB_REF_NAME.TrimStart("v")
          $MaxAttempts = 40
          $SleepSeconds = 15
          $Arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($Arch -ne "x64" -and $Arch -ne "arm64") {
            throw "Unsupported runner arch: $Arch"
          }

          $ExpectedPackage = "@lenucksi/backlog.md-windows-$Arch"
          Write-Host "Waiting for @lenucksi/backlog.md@$Version install + $ExpectedPackage optional dependency..."

          for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
            if (Test-Path "sanity") {
              Remove-Item -Recurse -Force "sanity"
            }
            New-Item -ItemType Directory -Path "sanity" | Out-Null
            Push-Location "sanity"

            try {
              npm init -y | Out-Null
              "@lenucksi:registry=https://npm.pkg.github.com" | Out-File -FilePath ".npmrc" -Encoding ASCII
              "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" | Out-File -FilePath ".npmrc" -Encoding ASCII -Append
              npm i "@lenucksi/backlog.md@$Version" --prefer-online --no-audit --no-fund
              if ($LASTEXITCODE -eq 0) {
                npx backlog -v
                if ($LASTEXITCODE -eq 0) {
                  Write-Host "Install sanity succeeded on attempt $attempt/$MaxAttempts."
                  exit 0
                }
              }

              Write-Host "Attempt $attempt/$MaxAttempts failed."
              Write-Host "Expected optional package: $ExpectedPackage"
              npm ls --depth=1 | Out-Host
              if (Test-Path "node_modules/$ExpectedPackage") {
                Write-Host "Optional package directory exists: node_modules/$ExpectedPackage"
              } else {
                Write-Host "Optional package directory missing: node_modules/$ExpectedPackage"
              }
            } finally {
              Pop-Location
            }

            if ($attempt -lt $MaxAttempts) {
              Start-Sleep -Seconds $SleepSeconds
            }
          }

          throw "Install sanity timed out for @lenucksi/backlog.md@$Version."

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
        timeout-minutes: 15
      - name: Rename binaries for release
        run: |
          echo "=== Debug: Downloaded artifacts ==="
          find release-assets -type f -exec ls -lh {} \;
          echo "=== Processing artifacts ==="
          mkdir -p binaries
          for dir in release-assets/*/; do
            if [ -d "$dir" ]; then
              target=$(basename "$dir" | sed 's/backlog-//')
              echo "Processing target: $target"
              echo "Directory contents:"
              ls -la "$dir"
              binary=$(find "$dir" -name "backlog-bin*" -type f)
              if [ -n "$binary" ]; then
                echo "Found binary: $binary ($(ls -lh "$binary" | awk '{print $5}'))"
                if [[ "$target" == *"windows"* ]] && [[ "$binary" == *".exe" ]]; then
                  cp "$binary" "binaries/backlog-${target}.exe"
                  echo "Copied to binaries/backlog-${target}.exe ($(ls -lh "binaries/backlog-${target}.exe" | awk '{print $5}'))"
                else
                  cp "$binary" "binaries/backlog-${target}"
                  echo "Copied to binaries/backlog-${target} ($(ls -lh "binaries/backlog-${target}" | awk '{print $5}'))"
                fi
              fi
            fi
          done
          echo "=== Final binaries ==="
          ls -lh binaries/
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: binaries/*

  sync-version:
    needs: [github-release, npm-publish, install-sanity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
      - name: Sync version to tag
        shell: bash
        run: |
          TAG="${GITHUB_REF##refs/tags/v}"
          jq ".version = \"$TAG\"" package.json > tmp.json && mv tmp.json package.json
      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@3ea6ae190baf489ba007f7c92608f33ce20ef04a # v4
        with:
          commit_message: "chore: sync package.json version to ${{ github.ref_name }} [skip ci]"
          branch: main
          file_pattern: package.json
