name: Shai-Hulud 2.0 Security Check
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: gensecaihq/Shai-Hulud-2.0-Detector@55cd78e683ee88b1f0a7e084919908e402462ec3 # v1.0.2
        with:
          fail-on-critical: true
