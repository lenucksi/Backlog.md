name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  BUN_VERSION: 1.3.11

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      guard: ${{ steps.filter.outputs.guard }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            ts:
              - 'src/**'
              - 'scripts/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'biome.json'
            guard:
              - 'hooks/backlog-guard/**'
              - 'packages/backlog-guard/**'
            ci:
              - '.github/workflows/**'
              - 'sonar-project.properties'
              - 'renovate.json'

  test:
    name: lint-and-unit-test
    needs: [changes]
    if: needs.changes.outputs.ts == 'true' || needs.changes.outputs.guard == 'true' || needs.changes.outputs.ci == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ matrix.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile --linker=isolated
      - name: Run prek checks
        uses: j178/prek-action@01345c78b7de7d79edf368729212760396ba9345 # v2
      - run: bun run lint
      - name: Run knip
        run: bunx knip --no-exit-code --reporter compact
      - name: Run dependency-cruiser
        if: matrix.os == 'ubuntu-latest'
        run: bunx depcruise src/cli.ts src/server/index.ts src/mcp/server.ts --config .dependency-cruiser.cjs
      - name: Run tests with coverage
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            bun test --coverage --coverage-reporter=lcov --coverage-threshold=75 --timeout=30000 --max-concurrency=4 --reporter=junit --reporter-outfile=test-results.xml
          else
            bun test --coverage --coverage-reporter=lcov --coverage-threshold=75 --timeout=10000 --reporter=junit --reporter-outfile=test-results.xml
          fi
        shell: bash
      - name: Run interactive TUI regression tests
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/run-tui-interactive-tests.sh
      - name: Cross-Modality Parity Tests
        if: matrix.os == 'ubuntu-latest'
        run: bun test src/test/modality-parity.test.ts --timeout=10000
      - name: Upload coverage report (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  build-test:
    name: compile-and-smoke-test
    needs: [changes]
    if: needs.changes.outputs.ts == 'true' || needs.changes.outputs.ci == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64-baseline
          - os: macos-latest
            target: bun-darwin-x64
          - os: windows-latest
            target: bun-windows-x64-baseline
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ matrix.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile --linker=isolated
      - name: Build CSS (required for web entry point in compiled binary)
        shell: bash
        run: bun run build:css
      - name: Prime Bun cache for baseline target (Windows workaround)
        if: ${{ contains(matrix.target, 'baseline') && matrix.os == 'windows-latest' }}
        shell: bash
        run: |
          cd /c
          mkdir -p bun-cache-primer
          cd bun-cache-primer
          echo 'console.log("cache primer")' > index.js
          bun build --compile --target=${{ matrix.target }} ./index.js --outfile primer.exe || true
          cd $GITHUB_WORKSPACE
      - name: Build standalone binary
        shell: bash
        run: |
          VER="$(jq -r .version package.json)"
          OUT="backlog-test${{ contains(matrix.target,'windows') && '.exe' || '' }}"
          bun build src/cli.ts \
            --compile --minify \
            --target=${{ matrix.target }} \
            --define __EMBEDDED_VERSION__="\"${VER}\"" \
            --outfile="$OUT"
      - name: Smoke-test binary
        shell: bash
        run: |
          FILE="backlog-test${{ contains(matrix.target,'windows') && '.exe' || '' }}"
          chmod +x "$FILE"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell -command ".\\$FILE --version"
            powershell -command ".\\$FILE --help"
          else
            "./$FILE" --version
            "./$FILE" --help
          fi
      - name: Run interactive TUI tests against compiled binary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          RUN_INTERACTIVE_TUI_TESTS: "1"
          TUI_TEST_CLI_PATH: "./backlog-test"
          TUI_TEST_CLI_RUNTIME: ""
        run: |
          bun test src/test/tui-interactive-editor-handoff.test.ts --timeout=60000

  sonarqube:
    name: SonarQube Scan
    needs: [test]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.1
        with:
          name: coverage-report
          path: coverage/
      - name: Cache SonarCloud packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
